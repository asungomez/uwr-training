AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  uwr-training: the single CloudFormation stack for the app on AWS. Built up
  incrementally — this first slice provisions only the database: an Amazon RDS for
  PostgreSQL 16 instance sized to stay within the AWS Free Tier (db.t4g.micro,
  20 GB gp2, Single-AZ). Compute and the rest are added to THIS stack later. The
  instance can be made publicly reachable (locked to a CIDR) so migrations and
  local debugging work before there's any AWS compute.

# ---------------------------------------------------------------------------
# Parameters — everything that varies per environment or is a secret.
# ---------------------------------------------------------------------------
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >-
      VPC to place the database in. RDS is always inside a VPC (there is no
      "outside a VPC" option), but a VPC itself is free — only a NAT Gateway costs
      money, and this stack has none. Use your account's default VPC: it already has
      public subnets + an internet gateway at zero cost, and a publicly-accessible
      instance in it is reachable directly from your laptop (no VPN/bastion needed),
      scoped by the security group below.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two subnets in different Availability Zones (RDS requires two even
      for Single-AZ). The default VPC's subnets are fine.

  DBName:
    Type: String
    Default: uwr
    Description: Initial database name created inside the instance.
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
    MinLength: 1
    MaxLength: 63

  MasterUsername:
    Type: String
    Default: uwr
    Description: Master (admin) username for the instance.
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
    MinLength: 1
    MaxLength: 63

  MasterUserPassword:
    Type: String
    Description: >-
      Master user password. Provided at deploy time and never echoed. 8-128 chars,
      no '/', '@', '"', or spaces (RDS restriction).
    NoEcho: true
    MinLength: 8
    MaxLength: 128
    AllowedPattern: '[^/@"\s]+'
    ConstraintDescription: 8-128 characters and must not contain /, @, ", or spaces.

  InstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: >-
      Instance class. db.t4g.micro (Graviton) is the cheapest Free-Tier-eligible
      option; db.t3.micro is the x86 equivalent if you hit a t4g availability issue.
    AllowedValues:
      - db.t4g.micro
      - db.t3.micro

  AllocatedStorage:
    Type: Number
    Default: 20
    Description: Storage in GB. Free Tier covers 20 GB of General Purpose (SSD).
    MinValue: 20
    MaxValue: 20
    ConstraintDescription: Kept at 20 GB to stay within the Free Tier storage allowance.

  EngineVersion:
    Type: String
    Default: "16"
    Description: >-
      PostgreSQL major version (matches the dev stack's postgres:16). Major-only is
      accepted; RDS picks a supported minor and AutoMinorVersionUpgrade keeps it current.

  BackupRetentionDays:
    Type: Number
    Default: 7
    Description: >-
      Automated backup retention (days). Backup storage up to the DB's provisioned
      size is free. 0 disables automated backups.
    MinValue: 0
    MaxValue: 35

  PubliclyAccessible:
    Type: String
    Default: "true"
    Description: >-
      Whether the instance gets a public endpoint. "true" lets you connect from the
      allowed CIDR before there's any AWS compute; flip to "false" once the app runs
      inside the VPC.
    AllowedValues: ["true", "false"]

  AllowedCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: >-
      CIDR allowed to reach Postgres (port 5432). Defaults to a non-routable
      placeholder — set it to your IP (e.g. 203.0.113.4/32) so nothing is exposed
      by accident. Never use 0.0.0.0/0.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
    ConstraintDescription: Must be a valid CIDR like 203.0.113.4/32.

  DeletionProtection:
    Type: String
    Default: "false"
    Description: >-
      Guards against accidental deletion. Left "false" while we're experimenting so
      the stack can be torn down cheaply; turn "true" for anything real.
    AllowedValues: ["true", "false"]

  # --- API (Lambda + HTTP API) -------------------------------------------------
  ApiImageUri:
    Type: String
    Default: ""
    Description: >-
      ECR image URI (with digest or tag) the API Lambda runs. Left empty on the very
      first deploy so the ECR repo + exec role are created before any image exists;
      the deploy workflow then pushes the image and redeploys with this set, which
      brings up the Lambda + HTTP API. Empty = database-and-ECR-only stack.

  SecretKey:
    Type: String
    Default: ""
    Description: >-
      Signs session-cookie JWTs (app SECRET_KEY). Must be a stable non-empty value once
      the Lambda is live; passed from a GitHub secret. NoEcho so it's never displayed.
    NoEcho: true

  RouteTableIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Route table IDs the S3 gateway endpoint attaches to (the default VPC's route
      tables). The deploy workflow discovers these like it does the subnets, so they're
      not hand-entered. Only used when the Lambda exists (an image is present).

  # NOTE: no S3 credential or CORS parameters. S3 bucket/region/URL come from the
  # in-stack MediaBucket (via !Ref/!GetAtt); the Lambda authenticates to S3 with its
  # execution role (no static keys). CORS_ORIGINS will come from the in-stack front-end
  # resource's URL once that's added; until then the app's localhost default is fine.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  # The Lambda + HTTP API resources only exist once an image URI is supplied. This lets
  # the first deploy create the ECR repo (and DB) with no image, so the workflow has a
  # repo to push to before the function that consumes the image is created.
  HasImage: !Not [!Equals [!Ref ApiImageUri, ""]]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} - Postgres access"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref AllowedCidr
          Description: PostgreSQL from the allowed CIDR
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - Postgres subnet group"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-subnets"

  Database:
    Type: AWS::RDS::DBInstance
    # Snapshot the volume on stack deletion rather than losing data outright; harmless
    # while empty, a safety net once it holds real logs. Set to Delete if you prefer
    # clean teardowns during early experimentation.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      # W1011 suggests sourcing the master password from Secrets Manager / SSM via a
      # dynamic reference. Deliberately not doing that yet: the password comes from a
      # GitHub secret passed at deploy time as a NoEcho parameter. Revisit if/when we
      # add Secrets Manager (which would also enable rotation).
      cfn-lint:
        config:
          ignore_checks:
            - W1011
    Properties:
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBName: !Ref DBName
      DBInstanceClass: !Ref InstanceClass
      MasterUsername: !Ref MasterUsername
      MasterUserPassword: !Ref MasterUserPassword
      # --- storage: cheapest Free-Tier-safe config ---
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp2
      StorageEncrypted: true # default aws/rds KMS key — no extra cost
      # --- keep it single-node and quiet (all cost-free choices) ---
      MultiAZ: false
      BackupRetentionPeriod: !Ref BackupRetentionDays
      AutoMinorVersionUpgrade: true
      MonitoringInterval: 0 # enhanced monitoring off (it bills)
      # Performance Insights left off (only its short retention is free); enable later.
      DeletionProtection: !Ref DeletionProtection
      PubliclyAccessible: !Ref PubliclyAccessible
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db"
        - Key: Project
          Value: uwr-training

  # --- Container registry for the API image ----------------------------------
  # Created on every deploy (even the first, imageless one) so the workflow has a repo
  # to push to before the Lambda that consumes the image exists.
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-api"
      ImageTagMutability: MUTABLE
      # Lambda pulls the image as the `lambda.amazonaws.com` service principal, not as the
      # account — so the repo must explicitly grant it pull access, or the function fails
      # to create with "Lambda does not have permission to access the ECR image". Scoped
      # to this account's functions via SourceAccount.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrieval
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      # Keep only the few most recent images so untagged layers don't accrue storage cost.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # --- API Lambda networking + role (only once there's an image to run) --------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasImage
    Properties:
      GroupDescription: !Sub "${AWS::StackName} - API Lambda"
      VpcId: !Ref VpcId
      # No ingress: nothing connects TO the Lambda (API Gateway invokes it via the AWS
      # control plane, not the network). Egress stays at the default allow-all so it can
      # reach the DB and the S3 gateway endpoint.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-lambda-sg"

  # Let the Lambda reach Postgres. Kept as a separate ingress rule (not inline on the DB
  # SG) to avoid a circular dependency between the two security groups.
  DBIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasImage
    Properties:
      GroupId: !Ref DBSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: PostgreSQL from the API Lambda

  # A VPC-attached Lambda has no internet route (no NAT), but the API makes server-side
  # S3 calls (multipart upload create/list/complete/abort). A gateway endpoint routes S3
  # traffic privately, at no cost, by adding S3's prefix-list route to the VPC's route
  # tables. (Simple presigned-POST uploads go browser→S3 directly and are unaffected;
  # this is what makes the Lambda's own S3 calls work.)
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasImage
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasImage
    Properties:
      RoleName: !Sub "${AWS::StackName}-api-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Managed policy for CloudWatch Logs + creating/attaching the VPC ENIs a VPC Lambda
      # needs.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      # Least-privilege access to the media bucket — the app authenticates to S3 with
      # this role (no static keys). Object ops (incl. multipart) on the objects, and the
      # bucket-level list actions multipart needs. Reads are public via the bucket
      # policy, but GetObject is included for any server-side read.
      Policies:
        - PolicyName: media-s3-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub "${MediaBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt MediaBucket.Arn
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-api-lambda-role"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasImage
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14 # keep logs cheap; 14 days is plenty for a hobby app

  ApiFunction:
    Type: AWS::Lambda::Function
    Condition: HasImage
    DependsOn: ApiLogGroup # ensure the log group exists with our retention first
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      PackageType: Image
      Code:
        ImageUri: !Ref ApiImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30 # API Gateway HTTP API caps at 30s; match it
      MemorySize: 512 # CPU scales with memory — 512 MB keeps FastAPI cold starts snappy
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          # asyncpg URL to the in-stack database (settings.py normalizes the scheme).
          DATABASE_URL: !Sub
            - "postgresql://${User}:${Pass}@${Host}:${Port}/${Name}"
            - User: !Ref MasterUsername
              Pass: !Ref MasterUserPassword
              Host: !GetAtt Database.Endpoint.Address
              Port: !GetAtt Database.Endpoint.Port
              Name: !Ref DBName
          SECRET_KEY: !Ref SecretKey
          COOKIE_SECURE: "true"
          # Media (S3). Bucket/region/URL come from the in-stack bucket. The key/secret
          # and endpoint are set EMPTY to override the app's MinIO-oriented defaults:
          # empty keys → boto3 uses the execution role; empty endpoint → the real
          # regional S3 endpoint.
          S3_BUCKET: !Ref MediaBucket
          S3_REGION: !Ref AWS::Region
          S3_PUBLIC_BASE_URL: !Sub "https://${MediaBucket.RegionalDomainName}"
          S3_ENDPOINT_URL: ""
          S3_ACCESS_KEY_ID: ""
          S3_SECRET_ACCESS_KEY: ""
          # No CORS_ORIGINS yet — comes from the in-stack front-end URL once it's added.
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-api"
        - Key: Project
          Value: uwr-training

  # HTTP API (v2): cheaper/simpler than REST, and Mangum speaks its payload format.
  # A catch-all route forwards every method+path to the Lambda (FastAPI does routing).
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: HasImage
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      Target: !GetAtt ApiFunction.Arn

  # AWS::ApiGatewayV2::Api's `Target` shortcut auto-creates the integration, the
  # $default route, and a $default auto-deploy stage — but NOT the invoke permission,
  # so we grant it explicitly.
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasImage
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  # --- Media storage (S3) ----------------------------------------------------
  # New home for exercise/material media, replacing the old eu-west-1 bucket. Created
  # unconditionally (independent of the API image) so data can be migrated into it
  # before the app is repointed at it. Config mirrors the old bucket: publicly readable
  # objects (the app builds plain public URLs), ACLs disabled, AES256 at rest, and CORS
  # allowing the browser-direct presigned uploads.
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-media-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        # All false so the public-read bucket policy below can take effect.
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, POST, PUT]
            AllowedOrigins:
              # Update to the AWS front-end origin when the SPA moves off Render.
              - https://uwr-training-frontend.onrender.com
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-media"
        - Key: Project
          Value: uwr-training

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadMedia
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"

  # --- Front-end hosting (S3 + CloudFront) -----------------------------------
  # The SPA's built assets live in a PRIVATE bucket, served only through CloudFront
  # (via Origin Access Control). CloudFront also proxies /api/* to the API Gateway, so
  # the browser sees ONE origin for both app and API — same-origin, exactly like the old
  # Render setup: no CORS, and the session cookie stays SameSite=lax. The SPA keeps
  # calling its relative "/api" base unchanged.
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Fully private — CloudFront reads it via OAC; nothing is world-accessible.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-frontend"
        - Key: Project
          Value: uwr-training

  # Lets CloudFront (and only CloudFront) sign requests to the private bucket.
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasImage
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Strips the "/api" prefix before requests hit the API Gateway origin (which serves
  # routes at the root, e.g. /health). Equivalent to the old Render rewrite. Plain
  # string ops (no regex) to stay within the CloudFront Functions runtime.
  ApiPathRewriteFunction:
    Type: AWS::CloudFront::Function
    Condition: HasImage
    Properties:
      Name: !Sub "${AWS::StackName}-strip-api-prefix"
      AutoPublish: true
      FunctionConfig:
        Comment: Strip the /api prefix before forwarding to the API Gateway origin
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          // Behavior only routes /api/* here; drop the 4-char "/api" prefix.
          request.uri = request.uri.substring(4);
          if (request.uri === '') { request.uri = '/'; }
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasImage
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} SPA + /api proxy"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100 # cheapest edge set (NA + EU); fine for a hobby app
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # empty: using OAC, not the legacy OAI
          - Id: api-gateway
            # ApiEndpoint is "https://<host>"; take just the host for the origin.
            DomainName: !Select [2, !Split ["/", !GetAtt HttpApi.ApiEndpoint]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          # Managed "CachingOptimized" — honors the assets' Cache-Control.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-gateway
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # Managed "CachingDisabled" — the API is dynamic.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed "AllViewerExceptHostHeader" — forward cookies/headers/query but
            # let CloudFront set the Host to the API Gateway origin (it rejects others).
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewriteFunction.FunctionMetadata.FunctionARN
        # SPA deep links: S3 returns 403/404 for unknown keys → serve index.html so the
        # client router handles the route.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          # Default *.cloudfront.net cert (HTTPS out of the box). Swap for an ACM cert
          # in us-east-1 + Aliases when a custom domain is added.
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasImage
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

# ---------------------------------------------------------------------------
# Outputs — for the deploy job / migrations / local debugging. No secrets echoed.
# Everything lives in this one stack, so resources reference each other directly
# (!Ref / !GetAtt) rather than via cross-stack Exports — hence plain Outputs here.
# ---------------------------------------------------------------------------
Outputs:
  DBEndpointAddress:
    Description: Hostname of the database instance.
    Value: !GetAtt Database.Endpoint.Address

  DBEndpointPort:
    Description: Port the database listens on.
    Value: !GetAtt Database.Endpoint.Port

  DBName:
    Description: Initial database name.
    Value: !Ref DBName

  DBSecurityGroupId:
    Description: Security group protecting the database (app compute joins this later).
    Value: !Ref DBSecurityGroup

  DatabaseUrlHint:
    Description: >-
      Shape of the connection string the app expects (settings.py normalizes the
      scheme to postgresql+asyncpg). Fill in the master password yourself.
    Value: !Sub "postgresql://${MasterUsername}:<password>@${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}"

  ApiRepositoryUri:
    Description: ECR repository URI the deploy workflow pushes the API image to.
    Value: !GetAtt ApiRepository.RepositoryUri

  ApiUrl:
    Condition: HasImage
    Description: Base URL of the HTTP API (the $default auto stage). Test the API here.
    Value: !GetAtt HttpApi.ApiEndpoint

  MediaBucketName:
    Description: New media bucket — the `aws s3 sync` destination when migrating.
    Value: !Ref MediaBucket

  MediaPublicBaseUrl:
    Description: >-
      Public base URL for reading media (app S3_PUBLIC_BASE_URL when we repoint it).
      public_url() appends the object key to this.
    Value: !Sub "https://${MediaBucket.RegionalDomainName}"

  FrontendBucketName:
    Description: SPA asset bucket — the frontend deploy syncs the built dist/ here.
    Value: !Ref FrontendBucket

  CloudFrontUrl:
    Condition: HasImage
    Description: Public URL of the SPA (also proxies /api). Visit this / point DNS here.
    Value: !Sub "https://${FrontendDistribution.DomainName}"

  CloudFrontDistributionId:
    Condition: HasImage
    Description: Distribution id — the frontend deploy invalidates the cache with it.
    Value: !Ref FrontendDistribution
